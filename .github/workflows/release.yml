name: Release Obsidian Theme

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            manifest.json \
            theme.css \
            --title "VaultVale Hearthwood ${GITHUB_REF_NAME}" \
            --notes "VaultVale Hearthwood ${GITHUB_REF_NAME} — Cozy parchment light & subterranean slate dark theme for Obsidian."
